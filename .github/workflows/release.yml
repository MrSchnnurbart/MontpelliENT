name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Decode Production Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "Keystore de production décodé avec succès."
          else
            echo "::warning::Le secret RELEASE_KEYSTORE_BASE64 n'est pas configuré dans GitHub Secrets. Signature de secours active."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_FILE: keystore/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare Release Assets & Checksums
        id: assets
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p release-artifacts
          
          # Recherche et standardisation du binaire APK
          APK_FOUND=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Erreur: Aucun binaire APK trouvé dans android/app/build/outputs/apk/release/"
            exit 1
          fi
          
          cp "$APK_FOUND" "release-artifacts/MontpelliENT-${TAG}.apk"
          
          # Calcul de l'empreinte cryptographique SHA256
          cd release-artifacts
          sha256sum "MontpelliENT-${TAG}.apk" > "MontpelliENT-${TAG}.apk.sha256"
          cd ..
          
          echo "Asset généré avec succès :"
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MontpelliENT ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
